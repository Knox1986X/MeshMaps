name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Data smoke test
        run: npm run smoke

      - name: UI smoke test (jsdom)
        run: npm run test:ui

      - name: Production build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: meshmaps-web
          path: dist
          retention-days: 7
