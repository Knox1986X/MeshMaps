name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + web build
        run: npm run build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with the Android SDK preinstalled —
      # no third-party setup action needed (it was failing).
      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshmaps-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # on a tag push the APK is also attached to a GitHub Release,
      # so it can be installed with one direct link
      - name: Publish release with APK
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="meshmaps-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MeshMaps ${TAG}" --notes "Debug APK (Capacitor + MapLibre), собран из коммита ${GITHUB_SHA}." --latest
          gh release upload "$TAG" "$ASSET" --clobber
