name: Linux AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # Build on an older Ubuntu so the AppImage runs on newer distributions (CachyOS/Arch included).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build AppImage
        env:
          # linuxdeploy's bundled strip can fail on newer system libraries; the app is not affected.
          NO_STRIP: 'true'
        run: npm run tauri build -- --bundles appimage

      - name: Collect AppImage
        run: |
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-artifacts/
          ls -lh dist-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMaps-AppImage
          path: dist-artifacts/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.AppImage
