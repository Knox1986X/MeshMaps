name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Permissions and icons
        run: node tools/android/prepare.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MeshMaps-debug.apk
          ls -lh MeshMaps-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMaps-android-debug
          path: MeshMaps-debug.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MeshMaps-debug.apk
