      .t { fill: #e8edf6; font: 500 13px Inter, system-ui, sans-serif; }
      .s { fill: #8d99aa; font: 400 11px Inter, system-ui, sans-serif; }
      .m { fill: #6b7a8d; font: 400 10px "JetBrains Mono", monospace; }
      .chip { fill: #4f8cff; fill-opacity: .18; stroke: #4f8cff; stroke-opacity: .45; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <rect width="1200" height="720" fill="url(#grid)" />

